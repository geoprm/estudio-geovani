<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Estúdio Geovani</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@600;700&family=Nunito:wght@600;700;800;900&family=Playfair+Display:wght@700;900&display=swap">
<style>
/* Layout: uma coluna de celular (máx. 520 px), cabeçalho fixo no topo, barra de abas fixa embaixo.
   Dois mundos visuais, um por perfil: @direitaxx (tinta + amarelo-girassol, Anton) e
   Dr. Geovani (azul-marinho + dourado, Playfair). O perfil troca as variáveis abaixo. */
:root {
  --bg: #0D0E10;
  --surface: #17191D;
  --surface2: #21242B;
  --line: #2D313A;
  --fg: #F4F2EC;
  --muted: #9BA1AC;
  --accent: #FFD400;
  --accent-ink: #191400;
  --accent-deep: #B89A00;
  --ok: #27C97A;
  --ok-deep: #178A52;
  --ok-ink: #04200F;
  --warn: #FF9F1A;
  --alert: #F2464B;
  --flame: #FF8A00;
  --display: 'Anton', Impact, 'Arial Narrow', sans-serif;
  --display-case: uppercase;
  --display-track: .01em;
  --body: 'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 20px;
  color-scheme: dark;
}
:root[data-perfil="drgeovani"] {
  --bg: #030B1E;
  --surface: #0B1734;
  --surface2: #12224A;
  --line: #1F3262;
  --fg: #F1F3F8;
  --muted: #98A4C1;
  --accent: #E5A93C;
  --accent-ink: #1F1404;
  --accent-deep: #A47426;
  --display: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --display-case: none;
  --display-track: 0;
}
:root[data-perfil="arquivo"] {
  --bg: #070608;
  --surface: #121013;
  --surface2: #1D1920;
  --line: #2F2830;
  --fg: #EFE7D6;
  --muted: #A69C8B;
  --accent: #D6A854;
  --accent-ink: #1A1206;
  --accent-deep: #8C6A2C;
  --flame: #C8892E;
  --display: 'Cinzel', Georgia, 'Times New Roman', serif;
  --display-case: uppercase;
  --display-track: .03em;
}
html, body { height: 100%; background: var(--bg); }
body { margin: 0; color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.app { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px)); }

/* ---------- topo */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px 10px; }
.seg { display: flex; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 4px; min-width: 0; }
.seg button { border: 0; background: transparent; color: var(--muted); font-weight: 900; font-size: 12.5px;
  padding: 8px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.stats { display: flex; gap: 12px; align-items: center; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat { display: flex; align-items: center; gap: 4px; font-size: 15px; }
.stat svg { width: 22px; height: 22px; }
.stat.flame { color: var(--flame); }
.stat.xp { color: var(--accent); }

/* ---------- tipografia */
.disp { font-family: var(--display); text-transform: var(--display-case); letter-spacing: var(--display-track);
  font-weight: 900; line-height: 1.05; margin: 0; text-wrap: balance; }
h1.disp { font-size: 34px; }
h2.disp { font-size: 24px; }
.eyebrow { font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.muted { color: var(--muted); }
p { margin: 0; }
.stack { display: grid; gap: 16px; }
.stack-s { display: grid; gap: 8px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
section.view { display: grid; gap: 20px; padding-top: 6px; }
.hello { display: grid; gap: 4px; }

/* ---------- cartões e botões */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.card.hero { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); border-bottom-width: 6px; }
.btn { appearance: none; border: 0; border-radius: 16px; padding: 14px 18px; font-weight: 900; font-size: 15px;
  letter-spacing: .05em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 5px 0 var(--accent-deep); cursor: pointer; transition: transform .06s, box-shadow .06s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--accent-deep); }
.btn.ghost { background: var(--surface2); color: var(--fg); box-shadow: 0 5px 0 var(--line); }
.btn.ghost:active { box-shadow: 0 0 0 var(--line); }
.btn.ok { background: var(--ok); color: var(--ok-ink); box-shadow: 0 5px 0 var(--ok-deep); }
.btn.danger { background: var(--alert); color: #fff; box-shadow: 0 5px 0 color-mix(in srgb, var(--alert) 60%, #000); }
.btn.small { padding: 10px 14px; font-size: 13px; border-radius: 13px; }
.btn.block { width: 100%; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn:disabled { opacity: .45; pointer-events: none; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 800; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 900; letter-spacing: .06em;
  text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
.chip.accent { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.chip.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.chip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.chip.err { background: color-mix(in srgb, var(--alert) 20%, transparent); color: var(--alert); }

/* ---------- pautas */
.nota { display: inline-flex; gap: 3px; }
.nota i { width: 10px; height: 18px; border-radius: 4px; background: var(--surface2); display: block; }
.nota i.on { background: var(--flame); }
.gancho { font-size: 21px; font-weight: 900; line-height: 1.25; margin: 0; }
.gancho::before { content: "“"; color: var(--accent); }
.gancho::after { content: "”"; color: var(--accent); }
.fala-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.fala-list li { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: start; }
.tempo { font-size: 12px; font-weight: 900; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
  border-radius: 8px; padding: 4px 6px; text-align: center; font-variant-numeric: tabular-nums; }
.box { background: var(--surface2); border-radius: 14px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.box p { white-space: pre-wrap; overflow-wrap: anywhere; }
.fontes a { color: var(--accent); font-weight: 800; overflow-wrap: anywhere; }
.older { display: grid; gap: 8px; }
.card.rec { gap: 10px; border-style: solid; }
.check { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin: 1px 0 0; }
.check span { display: grid; gap: 2px; }
h3.disp { font-size: 19px; }
.gancho.sm { font-size: 17px; }
.porque { margin: 0; font-size: 14px; line-height: 1.4; padding-left: 10px; border-left: 3px solid var(--ok); color: var(--fg); }
.porque.atemp { border-left-color: var(--accent); }
.porque b { color: var(--ok); }
.porque.atemp b { color: var(--accent); }
.older button { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px;
  cursor: pointer; display: grid; gap: 2px; }

/* ---------- teleprompter */
.prompter { background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 20px;
  display: grid; gap: 18px; min-height: 52vh; align-content: space-between; }
.prompter .fala { font-size: clamp(26px, 7.4vw, 40px); line-height: 1.2; font-weight: 900; text-wrap: pretty; }
.dots { display: flex; gap: 6px; }
.dots i { height: 8px; flex: 1; border-radius: 999px; background: var(--surface2); }
.dots i.on { background: var(--accent); }
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
.tips { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.tips li { display: flex; gap: 10px; align-items: flex-start; }
.tips svg { width: 22px; height: 22px; flex: none; color: var(--ok); margin-top: 1px; }

/* ---------- enviar */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { border: 2px solid var(--line); border-bottom-width: 6px; border-radius: 18px; background: var(--surface);
  padding: 12px; text-align: left; display: grid; gap: 8px; cursor: pointer; min-width: 0; }
.tile[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.tile svg { width: 100%; height: auto; max-width: 100%; display: block; }
.tile b { font-size: 15px; }
.tile span { font-size: 13px; color: var(--muted); line-height: 1.3; }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-weight: 900; font-size: 14px; }
select, textarea, input[type="number"] { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px; width: 100%; box-sizing: border-box; }
textarea { min-height: 84px; resize: vertical; }
.drop { display: grid; place-items: center; gap: 8px; border: 2px dashed var(--line); border-radius: 18px; padding: 22px 14px;
  text-align: center; cursor: pointer; background: var(--surface); }
.drop svg { width: 42px; height: 42px; color: var(--accent); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.bar { height: 18px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 999px;
  box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .18), inset 0 5px 0 rgba(255, 255, 255, .22); transition: width .3s; }
.bar.indet > i { width: 35%; animation: indet 1.3s ease-in-out infinite; background: var(--warn); }
@keyframes indet { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

/* ---------- prontos */
.player { width: 100%; max-width: 100%; aspect-ratio: 9 / 16; border-radius: 16px; background: #000; display: block; max-height: 70vh; object-fit: contain; }
.ab { display: inline-flex; background: var(--surface2); border-radius: 999px; padding: 4px; }
.ab button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-weight: 900; color: var(--muted); cursor: pointer; }
.ab button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.metric { display: grid; gap: 4px; }
.metric label { font-size: 12px; font-weight: 800; color: var(--muted); }

/* ---------- metas */
.streak { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.streak svg { width: 72px; height: 72px; color: var(--flame); }
.big { font-family: var(--display); font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week div { display: grid; gap: 4px; justify-items: center; font-size: 12px; font-weight: 900; color: var(--muted); }
.week i { width: 30px; height: 30px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; }
.week i.on { background: var(--flame); }
.week i svg { width: 18px; height: 18px; color: #fff; }
.week i.today { outline: 2px solid var(--fg); outline-offset: 2px; }
.lvl { display: grid; gap: 8px; }
.metas { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.metas li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.metas small { grid-column: 1 / -1; color: var(--muted); }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge { display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); }
.badge i { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; background: var(--surface2);
  border-bottom: 5px solid var(--line); }
.badge i svg { width: 30px; height: 30px; }
.badge.on { color: var(--fg); }
.badge.on i { background: var(--accent); color: var(--accent-ink); border-bottom-color: var(--accent-deep); }

/* ---------- abas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 2px solid var(--line);
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.tabs-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tab { display: grid; justify-items: center; gap: 2px; border: 2px solid transparent; border-radius: 14px; background: none;
  color: var(--muted); font-weight: 900; font-size: 11px; letter-spacing: .02em; padding: 6px 0; cursor: pointer; }
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--accent); border-color: var(--line); background: var(--surface2); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--alert); position: absolute; margin: -2px 0 0 22px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--fg); color: var(--bg); font-weight: 900; padding: 12px 18px; border-radius: 14px; max-width: min(90vw, 460px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .4); text-align: center; }
.empty { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 22px 10px; }
.empty svg { width: 64px; height: 64px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }

/* ---------- Arquivo Oculto */
.arq-hero { position: relative; overflow: hidden; padding: 0; border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.arq-hero img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: 50% 22%; }
.arq-hero .arq-txt { position: absolute; inset: auto 0 0 0; padding: 60px 16px 16px; display: grid; gap: 4px;
  background: linear-gradient(transparent, rgba(7, 6, 8, .92) 55%); }
.arq-hero .arq-txt .disp { font-size: 28px; color: var(--accent); }
.ep-num { font-family: var(--display); color: var(--accent); font-size: 13px; letter-spacing: .12em; }
.cena-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.cena-list li { display: grid; gap: 4px; padding-left: 12px; border-left: 3px solid var(--line); }
.cena-list li b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.selo { font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
</style>

<div class="app">
  <header class="top">
    <div class="seg" role="group" aria-label="Perfil">
      <button type="button" id="p-direitaxx" data-perfil="direitaxx">@direitaxx</button>

    </div>
  </header>
  <main id="main" aria-live="polite"></main>
</div>

<nav class="tabs" aria-label="Seções">
  <div class="tabs-in" id="tabs"></div>
</nav>
<div class="toast" id="toast" role="status" hidden></div>

  // ------------------------------------------------------------ util

      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? (k.startsWith('aria-') ? 'true' : '') : v);

    for (const c of kids.flat(Infinity)) {

  function saudacao() {

  function haQuanto(iso) {
    if (!iso) return '';

    if (m < 1) return 'agora';

    const hr = Math.round(m / 60);

  // ------------------------------------------------------------ estado
  const S = {
    perfil: PERFIS[lsGet('perfil')] ? lsGet('perfil') : 'direitaxx',

  const doPerfil = arr => arr.filter(x => x.perfil === S.perfil);

  // ------------------------------------------------------------ cálculos de metas
  function diaDe(iso) { return iso ? hojeISO(new Date(iso)) : ''; }
  function calcular() {
    const todos = S.pedidos;
    const dias = new Set(todos.filter(p => p.postadoEm).map(p => diaDe(p.postadoEm)));
    let streak = 0;
    const d = new Date();
    if (!dias.has(hojeISO(d))) d.setDate(d.getDate() - 1);
    while (dias.has(hojeISO(d))) { streak++; d.setDate(d.getDate() - 1); }
    let xp = 0;
    for (const p of todos) {
      if (p.status && p.status !== 'enviando') xp += 50;
      if (p.postadoEm) xp += 100;
      if (p.metricas) xp += 30;
    }
    const hoje = new Date();
    const dow = (hoje.getDay() + 6) % 7;
    const seg = new Date(hoje); seg.setDate(hoje.getDate() - dow);
    const semana = [];
    for (let i = 0; i < 7; i++) { const x = new Date(seg); x.setDate(seg.getDate() + i); semana.push(hojeISO(x)); }
    const postSemana = doPerfil(todos).filter(p => p.postadoEm && semana.includes(diaDe(p.postadoEm))).length;
    return { streak, xp, dias, semana, postSemana, nivel: 1 + Math.floor(xp / 500), resto: xp % 500 };
  }

  // ------------------------------------------------------------ render
  function podeRender() {
    const a = document.activeElement;
    if (a && a.closest && a.closest('#main') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;
    for (const v of document.querySelectorAll('#main video')) if (!v.paused && !v.ended) return false;
    return true;
  }
  function render(forcar) {
    if (!forcar && !podeRender()) { S.pendente = true; return; }
    S.pendente = false;
    document.documentElement.dataset.perfil = S.perfil;
    for (const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', b.dataset.perfil === S.perfil);
    const c = calcular();
    document.getElementById('st-streak').textContent = c.streak;
    document.getElementById('st-xp').textContent = c.xp;
    renderTabs();
    const main = document.getElementById('main');
    if (SO_IA[S.perfil] && S.tab === 'gravar') S.tab = 'hoje';
    const view = { hoje: SO_IA[S.perfil] ? vArquivo : vHoje, gravar: vGravar, enviar: vEnviar, prontos: vProntos, metas: vMetas }[S.tab](c);
    main.replaceChildren(view);
  }
  document.addEventListener('focusout', () => setTimeout(() => { if (S.pendente) render(); }, 50));

  function renderTabs() {
    const box = document.getElementById('tabs');

  // ---------- pautas
  function diasAte(d) {
    const a = new Date(txt(d) + 'T12:00:00'), b = new Date(hojeISO() + 'T12:00:00');
    return Math.round((b - a) / 864e5);
  }
  function quando(d) {
    const n = diasAte(d);
    return n === 0 ? 'Hoje' : n === 1 ? 'Ontem' : n === 2 ? 'Anteontem' : new Date(txt(d) + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  }
  function pautasUsadas() { return new Set(S.pedidos.map(p => p.pautaId).filter(Boolean)); }
  // Hoje: as 3 do dia. Ainda dá para gravar: as dos 2 dias anteriores (no Dr. Geovani, as atemporais
  // das semanas anteriores) que ainda não viraram vídeo e não venceram. O resto fica em "anteriores".
  function pautasAtuais() {
    const ps = doPerfil(S.pautas);
    if (!ps.length) return { data: '', lista: [], recomendadas: [], antigas: [] };
    const data = ps.reduce((m, p) => (txt(p.data) > m ? txt(p.data) : m), '');
    const lista = ps.filter(p => p.data === data).sort((a, b) => (a.ordem || 9) - (b.ordem || 9));
    const usadas = pautasUsadas();
    const janela = S.perfil === 'drgeovani' ? 56 : 2;
    const vale = p => (p.reaproveitar && p.reaproveitar.status === 'vale' ? 1 : 0);
    const recomendadas = ps.filter(p => p.data !== data && !usadas.has(p.id) && diasAte(p.data) <= janela
      && !(p.reaproveitar && p.reaproveitar.status === 'vencida'))
      .sort((a, b) => vale(b) - vale(a) || (Number(b.nota) || 0) - (Number(a.nota) || 0) || txt(b.data).localeCompare(txt(a.data)))
      .slice(0, 4);
    const rec = new Set(recomendadas.map(p => p.id));
    const antigas = ps.filter(p => p.data !== data && !rec.has(p.id)).sort((a, b) => (txt(b.data)).localeCompare(txt(a.data)));
    return { data, lista, recomendadas, antigas };
  }
  function notaEl(n) {

  function proximoPasso() {

  function pararTimer() {
    S.pr.rodando = false;
    cancelAnimationFrame(S.pr.raf);
    if (S.pr.lock) { S.pr.lock.release().catch(() => {}); S.pr.lock = null; }
  }
  async function iniciarTimer() {
    S.pr.rodando = true;
    S.pr.t0 = performance.now();
    try { if (navigator.wakeLock) S.pr.lock = await navigator.wakeLock.request('screen'); } catch (e) { S.pr.lock = null; }
    const tick = () => {
      if (!S.pr.rodando) return;
      const s = (performance.now() - S.pr.t0) / 1000;
      const ring = document.getElementById('ring-fill');
      const num = document.getElementById('ring-num');
      if (ring && num) {
        const frac = Math.min(1, s / 30);
        ring.setAttribute('stroke-dashoffset', String(251.3 * (1 - frac)));
        ring.setAttribute('stroke', s > 30 ? 'var(--alert)' : 'var(--accent)');
        num.textContent = String(Math.floor(s));

      S.pr.raf = requestAnimationFrame(tick);
    };
    tick();

  async function enviar() {
    const E = S.envio;

    const agora = new Date().toISOString();
    const id = 'v' + Date.now().toString(36);
    const ref = S.db.collection('pedidos').doc(id);

    try {
      await ref.set({
        perfil: S.perfil, formato: E.formato, pautaId: pauta ? pauta.id : '', pautaTitulo: pauta ? txt(pauta.titulo) : 'Tema livre',
        obs: txt(E.obs).slice(0, 2000), retoque: E.retoque !== false, arquivo: { nome: f.name.slice(0, 200), tamanho: f.size, tipo: f.type || '', partes: [] },
        status: 'enviando', etapa: 'Enviando o vídeo', criadoEm: agora, atualizadoEm: agora
      });

          else throw e;

      await ref.update({ arquivo: { partes }, status: 'na_fila', etapa: 'Na fila da edição', atualizadoEm: new Date().toISOString() });
      E.etapa = 'Chamando o editor…';
      atualizaEnvio();
      const acionou = await acionarEditor(id);
      E.arquivo = null; E.obs = ''; E.dur = 0;
      toast(acionou ? 'Recebido! O editor já começou.' : 'Recebido! Está na fila da edição.');
      E.enviando = false;
      ir('prontos');
    } catch (e) {
      E.enviando = false;
      const code = e && e.code;
      const msg = code === 'quota_or_state' ? 'O espaço do app encheu. Apague vídeos antigos em Prontos e tente de novo.'
        : code === 'rate_limited' ? 'Muitos envios seguidos. Espere um minuto e tente de novo.'
          : code === 'unsupported_type' ? 'Esse arquivo não é aceito. Envie um vídeo MP4 ou MOV.'
            : 'O envio parou no meio. Confira a internet e toque em Enviar de novo.';
      toast(msg);
      try { await ref.update({ status: 'erro', etapa: 'Envio interrompido', erro: msg, atualizadoEm: new Date().toISOString() }); } catch (e2) { /* o pedido pode nem existir */ }
      render(true);
    } finally {
      if (lock) lock.release().catch(() => {});
    }
  }
  async function acionarEditor(id) {
    const trig = S.config && S.config.editorTrigger;
    if (!S.mcp || !trig) return false;
    try {
      await S.mcp.callTool('Claude Code Remote', 'fire_trigger', { trigger_id: trig, text: `Pedido ${id} chegou pelo app.` }, { cache: false });
      try { await S.db.collection('pedidos').doc(id).update({ acionadoEm: new Date().toISOString() }); } catch (e) { /* só registro */ }
      return true;
    } catch (e) {
      if (e && e.code === 'approval_required') toast('Para o editor começar na hora, permita o acesso quando o Claude perguntar.');
      return false;
    }
  }

  // ---------- prontos
  const STATUS = {
    enviando: ['Enviando', 'warn'], na_fila: ['Na fila', ''], editando: ['Editando', 'warn'],
    pronto: ['Pronto', 'ok'], erro: ['Precisa de atenção', 'err']
  };
  async function baixar(assetId, nome, btn) {
    if (!S.downloads) { toast('Abra pelo app do Claude para baixar.'); return; }
    try {
      if (btn) btn.disabled = true;
      const r = await fetch('/_blob/' + assetId);
      if (!r.ok) throw new Error('fetch');
      const blob = await r.blob();
      await S.downloads.save({ filename: nome, data: blob });
      toast('Salvo');
    } catch (e) {
      if (!(e && e.code === 'declined')) toast('Não consegui baixar agora. Tente de novo.');
    } finally { if (btn) btn.disabled = false; }
  }
  async function marcarPostado(p) {
    try { await S.db.collection('pedidos').doc(p.id).update({ postadoEm: new Date().toISOString() }); toast('+100 pontos. Boa!'); }
    catch (e) { toast('Não salvei. Tente de novo.'); }
  }
  async function tentarDeNovo(p) {
    if (p.etapa === 'Envio interrompido') {
      // o vídeo não chegou inteiro: precisa mandar de novo
      S.envio.formato = p.formato || S.envio.formato; S.envio.pautaId = p.pautaId || '';
      toast('O vídeo não chegou inteiro. Escolha de novo e envie.');
      ir('enviar');
      return;
    }
    try {
      await S.db.collection('pedidos').doc(p.id).update({ status: 'na_fila', etapa: 'Na fila da edição', erro: '', atualizadoEm: new Date().toISOString() });
      const ok = await acionarEditor(p.id);
      toast(ok ? 'O editor recomeçou.' : 'Voltou para a fila.');
    } catch (e) { toast('Não consegui. Tente de novo.'); }
  }
  async function apagar(p) {
    const ids = [...((p.arquivo && p.arquivo.partes) || []), ...['a', 'b', 'capa'].map(k => p.resultado && p.resultado[k]).filter(Boolean)];
    try {
      if (S.assets) for (const id of ids) { try { await S.assets.delete(id); } catch (e) { /* segue */ } }
      await S.db.collection('pedidos').doc(p.id).delete();
      toast('Apagado');
    } catch (e) { toast('Não consegui apagar agora.'); }
  }
  async function salvarMetricas(p, form) {
    const num = k => { const v = form.querySelector(`[name="${k}"]`).value; return v === '' ? null : Number(String(v).replace(',', '.')); };
    const m = { views: num('views'), alcance: num('alcance'), tempoMedio: num('tempoMedio'), compart: num('compart'), naoSeg: num('naoSeg'), seguidores: num('seguidores') };
    try { await S.db.collection('pedidos').doc(p.id).update({ metricas: m }); S.metAberto.delete(p.id); toast('+30 pontos. Resultado salvo.'); render(true); }
    catch (e) { toast('Não salvei. Tente de novo.'); }
  }
  function cartaoPedido(p) {
    const [rot, cls] = STATUS[p.status] || ['—', ''];
    const res = p.resultado || {};
    const ver = S.versao[p.id] || 'a';
    const vid = ver === 'b' && res.b ? res.b : res.a;
    const andamento = ['enviando', 'na_fila', 'editando'].includes(p.status);
    const leg = h('p', { text: txt(res.legenda) });
    const m = p.metricas || {};
    const form = h('form', { class: 'stack', onsubmit: e => { e.preventDefault(); salvarMetricas(p, e.target); } },
      h('div', { class: 'grid2' }, [['views', 'Visualizações'], ['alcance', 'Pessoas alcançadas'], ['tempoMedio', 'Tempo médio (s)'],
        ['compart', 'Compartilhamentos'], ['naoSeg', '% não seguidores'], ['seguidores', 'Seguidores ganhos']].map(([k, l]) =>
        h('div', { class: 'metric' }, h('label', { for: `m-${p.id}-${k}`, text: l }),
          h('input', { type: 'number', inputmode: 'decimal', min: '0', step: 'any', id: `m-${p.id}-${k}`, name: k, value: m[k] != null ? String(m[k]) : null })))),
      h('button', { class: 'btn ok block', type: 'submit' }, 'Salvar resultado'));
    const conf = S.confirmar[p.id];
    return h('article', { class: 'card' },
      h('div', { class: 'row between' },
        h('span', { class: `chip ${cls}`, text: rot }),
        h('span', { class: 'note', text: haQuanto(p.atualizadoEm || p.criadoEm) })),
      h('h2', { class: 'disp', text: txt(p.pautaTitulo) || 'Tema livre' }),
      h('div', { class: 'row' }, h('span', { class: 'chip', text: p.formato === 'ia' ? 'Gerado por IA' : p.formato === 'filtro' ? 'Arquivista no rosto' : p.formato === 'depoimento' ? 'Depoimento' : 'Tela dividida' }),
        p.postadoEm ? h('span', { class: 'chip ok', text: 'Postado' }) : null),
      andamento ? [h('div', { class: 'bar indet' }, h('i')), h('p', { class: 'note', text: txt(p.etapa) })] : null,
      p.status === 'erro' ? [h('p', { class: 'muted', text: txt(p.erro) || 'Algo deu errado na edição.' }),
        h('button', { class: 'btn ghost', type: 'button', onclick: () => (p.formato === 'ia' ? recolocarIA(p) : tentarDeNovo(p)) }, 'Tentar de novo')] : null,
      p.status === 'pronto' && vid ? [
        res.b ? h('div', { class: 'ab', role: 'group', 'aria-label': 'Versão' },
          ['a', 'b'].map(k => h('button', { type: 'button', 'aria-pressed': ver === k, onclick: () => { S.versao[p.id] = k; render(true); } }, k === 'a' ? 'Versão A' : 'Versão B'))) : null,
        h('video', { class: 'player', src: '/_blob/' + vid, poster: res.capa ? '/_blob/' + res.capa : null, controls: true, playsinline: true, preload: 'metadata' }),
        h('div', { class: 'grid2' },
          h('button', { class: 'btn ghost small', type: 'button', onclick: e => baixar(vid, `${S.perfil}_${p.id}_${ver.toUpperCase()}.mp4`, e.currentTarget) }, 'Baixar vídeo'),
          res.capa ? h('button', { class: 'btn ghost small', type: 'button', onclick: e => baixar(res.capa, `${S.perfil}_${p.id}_capa.jpg`, e.currentTarget) }, 'Baixar capa') : h('span')),
        res.legenda ? h('div', { class: 'box' },
          h('div', { class: 'row between' }, h('p', { class: 'eyebrow', text: 'Legenda' }),
            h('button', { class: 'btn small ghost', type: 'button', onclick: () => copiar(txt(res.legenda), leg) }, 'Copiar')), leg) : null,
        res.nota ? h('p', { class: 'note', text: txt(res.nota) }) : null,
        !p.postadoEm ? h('button', { class: 'btn ok block', type: 'button', onclick: () => marcarPostado(p) }, 'Postei!')
          : h('div', { class: 'stack-s' },
            h('button', { class: 'link', type: 'button', onclick: () => { S.metAberto.has(p.id) ? S.metAberto.delete(p.id) : S.metAberto.add(p.id); render(true); } },
              p.metricas ? 'Editar resultado de 24 h' : 'Registrar resultado de 24 h'),
            S.metAberto.has(p.id) ? form : null)
      ] : null,
      h('div', { class: 'row' },
        conf ? [h('button', { class: 'btn danger small', type: 'button', onclick: () => { delete S.confirmar[p.id]; apagar(p); } }, 'Apagar de vez'),
          h('button', { class: 'btn ghost small', type: 'button', onclick: () => { delete S.confirmar[p.id]; render(true); } }, 'Cancelar')]
          : h('button', { class: 'link', type: 'button', onclick: () => { S.confirmar[p.id] = true; render(true); } }, 'Apagar este vídeo'))
    );
  }
  function vProntos() {
    const meus = doPerfil(S.pedidos);
    return h('section', { class: 'view', id: 'prontos' },
      h('div', { class: 'hello' }, h('p', { class: 'eyebrow', text: PERFIS[S.perfil].nome }), h('h1', { class: 'disp', text: 'Seus vídeos' })),
      aviso(),
      !S.carregou && !S.semDb ? estado('Carregando…')
        : meus.length ? meus.map(cartaoPedido)
          : SO_IA[S.perfil] ? h('div', { class: 'card empty' }, icon(ICON.film), h('p', { class: 'muted', text: 'Nenhum episódio gerado ainda. Escolha um episódio e toque em Gerar vídeo.' }),
            h('button', { class: 'btn', type: 'button', onclick: () => ir('hoje') }, 'Ver episódios'))
          : h('div', { class: 'card empty' }, icon(ICON.film), h('p', { class: 'muted', text: 'Nenhum vídeo ainda. Grave uma pauta e mande para edição.' }),
            h('button', { class: 'btn', type: 'button', onclick: () => ir('enviar') }, 'Enviar vídeo'))
    );
  }

  // ---------- metas
  function media(arr) { const v = arr.filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
  function vMetas(c) {
    const meus = doPerfil(S.pedidos);
    const com = meus.filter(p => p.metricas).slice(0, 5).map(p => p.metricas);
    const tempo = media(com.map(m => m.tempoMedio));
    const comp = media(com.map(m => (m.compart != null && m.alcance) ? m.compart / m.alcance * 100 : null));
    const nao = media(com.map(m => m.naoSeg));
    const seg = media(com.map(m => m.seguidores));
    const fmt = (v, suf, d = 0) => v == null ? '—' : v.toFixed(d).replace('.', ',') + suf;
    const linhas = [
      ['Tempo médio assistido', fmt(tempo, ' s', 1), tempo != null && tempo >= 6, 'Meta: 6 a 8 s. Hoje a página tem 2 a 3 s.'],
      ['Compartilhamentos por pessoa', fmt(comp, '%', 1), comp != null && comp >= 5, 'Meta: 5% ou mais.'],
      ['Views de não seguidores', fmt(nao, '%'), nao != null && nao >= 50, 'Meta: 50% ou mais.'],
      ['Seguidores por vídeo', fmt(seg, ''), seg != null && seg >= 10, 'Meta: 10 ou mais.']
    ];
    const postados = S.pedidos.filter(p => p.postadoEm).length;
    const badges = [
      ['Primeiro envio', S.pedidos.some(p => p.status && p.status !== 'enviando'), ICON.send],
      ['Primeiro post', postados >= 1, ICON.film],
      ['3 dias seguidos', c.streak >= 3, ICON.flame],
      ['7 dias seguidos', c.streak >= 7, ICON.flame],
      ['10 vídeos', postados >= 10, ICON.ten],
      ['Meta da semana', c.postSemana >= PERFIS[S.perfil].meta, ICON.trophy]
    ];
    const hoje = hojeISO();
    return h('section', { class: 'view', id: 'metas' },
      h('h1', { class: 'disp', text: 'Suas metas' }),
      aviso(),
      h('div', { class: 'card hero' },
        h('div', { class: 'streak' }, icon(ICON.flame),
          h('div', null, h('div', { class: 'big', text: String(c.streak) }), h('p', { class: 'muted', text: c.streak === 1 ? 'dia seguido postando' : 'dias seguidos postando' }))),
        h('div', { class: 'week' }, c.semana.map((d, k) => h('div', null, h('span', { text: DIAS[k] }),
          h('i', { class: (c.dias.has(d) ? 'on ' : '') + (d === hoje ? 'today' : '') }, c.dias.has(d) ? icon(ICON.check) : null))))),
      h('div', { class: 'card lvl' },
        h('div', { class: 'row between' }, h('h2', { class: 'disp', text: `Nível ${c.nivel}` }), h('span', { class: 'chip accent', text: `${c.xp} pontos` })),
        h('div', { class: 'bar' }, h('i', { style: `width:${c.resto / 5}%` })),
        h('p', { class: 'note', text: `Faltam ${500 - c.resto} pontos para o nível ${c.nivel + 1}. Enviar vale 50, postar vale 100, registrar o resultado vale 30.` })),
      h('div', { class: 'card' },
        h('div', { class: 'row between' }, h('h2', { class: 'disp', text: 'Metas de 24 h' }), h('span', { class: 'chip', text: com.length ? `média de ${com.length}` : 'sem dados' })),
        h('ul', { class: 'metas' }, linhas.map(([nome, valor, bateu, dica]) => h('li', null,
          h('b', { text: nome }), h('span', { class: 'chip ' + (valor === '—' ? '' : bateu ? 'ok' : 'warn'), text: valor }), h('small', { text: dica })))),
        !com.length ? h('p', { class: 'note', text: 'Depois de postar, registre os números de 24 h do Instagram em Prontos.' }) : null),
      h('div', { class: 'card' },
        h('h2', { class: 'disp', text: 'Conquistas' }),
        h('div', { class: 'badges' }, badges.map(([nome, on, ic]) => h('div', { class: 'badge' + (on ? ' on' : '') }, h('i', null, icon(ic)), h('span', { text: nome })))))
    );
  }

  // ------------------------------------------------------------ início
  for (const b of document.querySelectorAll('.seg button')) {
    b.addEventListener('click', () => { S.perfil = b.dataset.perfil; lsSet('perfil', S.perfil); S.pr.pautaId = ''; S.pr.passo = 0; pararTimer(); render(true); });
  }
  const tabHash = (location.hash || '').slice(1);
  if (TABS.some(t => t.id === tabHash)) S.tab = tabHash;
  render(true);

  async function iniciar() {
    if (!window.claude || !window.claude.use) { S.semDb = true; S.carregou = true; render(); return; }
    const pegar = n => window.claude.use(n).catch(() => null);
    const [db, assets, mcp, downloads] = await Promise.all([pegar('db'), pegar('assets'), pegar('mcp'), pegar('downloads')]);
    Object.assign(S, { db, assets, mcp, downloads });
    if (!db) { S.semDb = true; S.carregou = true; render(); return; }
    const falha = e => { S.erroDb = (e && e.code) || 'erro'; S.carregou = true; render(); };
    db.collection('pautas').orderBy('data', 'desc').limit(150).onSnapshot(s => {
      S.pautas = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
      S.carregou = true; render();
    }, falha);
    db.collection('pedidos').orderBy('criadoEm', 'desc').limit(200).onSnapshot(s => {
      S.pedidos = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
      render();
    }, falha);
    db.doc('config/app').onSnapshot(s => { S.config = s.exists ? s.data() : {}; }, () => {});
  }
  iniciar();
})();
</script>

</body></html>
